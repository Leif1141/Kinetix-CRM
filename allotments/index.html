<style>
/* Layout: one-screen app; a tall field fills everything between a slim top bar and a thumb-reach tool row */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --ink: #16191a;
  --muted: #646c68;
  --line: #d5dad6;
  --frame: #16191a;
  --accent: #2c6a4c;
  --accent-ink: #f4faf5;
  --bad: #c2412f;
  --bad-soft: rgba(194, 65, 47, .13);
  --on-plot: #15161a;
  --p0: #f2a19b; --p1: #f5cd66; --p2: #9db0ee; --p3: #8dd2b3; --p4: #f2ad7b; --p5: #c4a6e8;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e0f; --surface: #121314; --ink: #eef1ef; --muted: #8f9793; --line: #3a3e3d; --frame: #e9ecea;
    --accent: #6cc196; --accent-ink: #0e1a13; --bad: #ff7f6b; --bad-soft: rgba(255, 127, 107, .16);
    --p0: #e48c86; --p1: #ecc256; --p2: #8a9ee3; --p3: #79c6a4; --p4: #e89d68; --p5: #b496de;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e0f; --surface: #121314; --ink: #eef1ef; --muted: #8f9793; --line: #3a3e3d; --frame: #e9ecea;
  --accent: #6cc196; --accent-ink: #0e1a13; --bad: #ff7f6b; --bad-soft: rgba(255, 127, 107, .16);
  --p0: #e48c86; --p1: #ecc256; --p2: #8a9ee3; --p3: #79c6a4; --p4: #e89d68; --p5: #b496de;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.screen {
  height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px; max-width: 640px; margin: 0 auto;
}

/* Home */
.home { justify-content: center; gap: 28px; }
.brand { display: grid; gap: 6px; }
.mark { width: 64px; height: 64px; display: grid; grid-template: repeat(4, 1fr) / repeat(4, 1fr); gap: 3px; margin-bottom: 10px; }
.mark i { border-radius: 3px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: -.02em; margin: 0; line-height: 1; }
.brand p { margin: 0; color: var(--muted); font-size: 16px; }
.date { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.levels { display: grid; gap: 10px; }
.level {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
  text-align: left; padding: 16px 18px; border-radius: 14px; background: var(--surface);
  border: 1.5px solid var(--line); transition: transform .12s ease, border-color .12s;
}
.level:active { transform: scale(.98); }
.level b { font-family: var(--display); font-weight: 600; font-size: 21px; }
.level small { color: var(--muted); grid-column: 1; }
.level .st { grid-row: 1 / span 2; grid-column: 2; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
.level.done { border-color: var(--accent); }
.level.done .st { color: var(--accent); }
.links { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.links button { font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; padding: 6px 0; }
.streak { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* Game */
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 40px; }
.bar .back { justify-self: start; font-weight: 600; padding: 8px 10px 8px 0; }
.bar .title { text-align: center; line-height: 1.2; }
.bar .title b { font-family: var(--display); font-weight: 600; font-size: 17px; display: block; }
.bar .title span { color: var(--muted); font-size: 12px; }
.timer {
  justify-self: end; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 18px;
  padding: 8px 0 8px 10px; display: flex; align-items: center; gap: 7px;
}
.timer::after { content: ""; width: 8px; height: 11px; border-inline: 3px solid var(--muted); box-sizing: border-box; }
.stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; padding-block: 6px; }
.board {
  --cols: 10; --rows: 12;
  position: relative; container-type: inline-size;
  width: min(100cqw, calc(100cqh * var(--cols) / var(--rows)));
  aspect-ratio: var(--cols) / var(--rows);
  background: var(--surface); border: 2px solid var(--frame); border-radius: 3px;
  touch-action: none; overflow: hidden;
}
.board.hide > * { visibility: hidden; }
.cells, .clues { position: absolute; inset: 0; display: grid; grid-template: repeat(var(--rows), 1fr) / repeat(var(--cols), 1fr); }
.cells i { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.clues { pointer-events: none; z-index: 3; }
.clues span {
  display: grid; place-items: center; font-weight: 700; font-family: var(--body);
  font-size: calc(100cqw / var(--cols) * .5); font-variant-numeric: tabular-nums; line-height: 1;
  letter-spacing: -.02em; transition: color .15s;
}
.clues span.on { color: var(--on-plot); }
.plots { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.plot { position: absolute; padding: 3px; transition: opacity .15s; }
.plot .f { width: 100%; height: 100%; border-radius: 4px; background: var(--c); }
.plot.new .f { animation: pop .24s cubic-bezier(.3, 1.5, .5, 1); }
.plot.bad .f { background: var(--bad-soft); box-shadow: inset 0 0 0 2px var(--bad); }
.plot.bad.new .f { animation: shake .3s ease; }
.plot.doomed { opacity: .25; }
.plot.preview .f { background: color-mix(in srgb, var(--ink) 8%, transparent); box-shadow: inset 0 0 0 2.5px var(--ink); }
.plot.preview.ok .f { box-shadow: inset 0 0 0 2.5px var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.plot.wave .f { animation: wave .5s ease both; animation-delay: var(--d); }
.plot.flag .f { animation: flag 1.6s ease; }
.tag {
  position: absolute; z-index: 4; transform: translate(-50%, -115%); pointer-events: none;
  background: var(--ink); color: var(--surface); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
  padding: 5px 10px; border-radius: 999px; white-space: nowrap;
}
.tag.ok { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; gap: 8px; justify-content: center; padding-top: 6px; }
.tool {
  flex: 1; max-width: 120px; padding: 12px 6px; border-radius: 12px; font-weight: 600; white-space: nowrap;
  background: var(--surface); border: 1.5px solid var(--line); transition: transform .1s;
}
.tool:active { transform: scale(.96); }
.tool:disabled { opacity: .4; }
.tool.warn { border-color: var(--bad); color: var(--bad); }
.toast {
  position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 15;
  transform: translateX(-50%); background: var(--ink); color: var(--surface);
  padding: 10px 16px; border-radius: 999px; font-weight: 600; white-space: nowrap;
}
.toast.in { animation: toastIn .22s cubic-bezier(.2, .9, .3, 1); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }
@keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes wave { 50% { transform: scale(1.07); filter: brightness(1.1); } }
@keyframes flag { 0%, 70% { box-shadow: inset 0 0 0 3px var(--bad); background: var(--bad-soft); } }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 9, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto;
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: grid; gap: 16px; animation: up .28s cubic-bezier(.2, .9, .3, 1);
}
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: 28px; margin: 0; letter-spacing: -.01em; }
.sheet p { margin: 0; line-height: 1.5; color: var(--muted); max-width: 60ch; }
.sheet .big { font-family: var(--display); font-weight: 800; font-size: 56px; font-variant-numeric: tabular-nums; line-height: 1; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1; padding: 14px 16px; border-radius: 12px; font-weight: 600; border: 1.5px solid var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rules { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; line-height: 1.45; }
.rules li b { font-family: var(--display); color: var(--accent); }
.mini { justify-self: center; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

/* Archive */
.list { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 2px; margin-top: 8px; -webkit-overflow-scrolling: touch; }
.day { display: grid; grid-template-columns: 1fr repeat(3, 66px); align-items: center; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.day .d { font-weight: 600; min-width: 0; }
.day .d small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.chip { padding: 9px 0; border-radius: 9px; font-size: 13px; font-weight: 600; text-align: center; background: var(--surface); border: 1.5px solid var(--line); font-variant-numeric: tabular-nums; }
.chip.done { border-color: var(--accent); color: var(--accent); }
.chip.part { border-style: dashed; }
.colhead { display: grid; grid-template-columns: 1fr repeat(3, 66px); gap: 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.hap { position: fixed; left: -9999px; top: 0; opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="home" class="screen home">

<script type="text/plain" id="gen">
/*GEN*/
function rng(seed) {
  return function () {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffle(a, R) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Random split of a rows×cols field: first `bigs` large rectangles (12..bigMax squares) dropped at random,
// then everything else filled in reading order with small rectangles of 2..6 squares, short strips included.
// Returns null on a dead end (a square that could only be a 1).
function partition(rows, cols, bigs, bigMax, R) {
  const g = new Uint8Array(rows * cols), parts = [];
  for (let b = 0, tries = 0; b < bigs && tries < 200; tries++) {
    const h = 2 + Math.floor(R() * Math.min(rows - 1, 7)), w = 2 + Math.floor(R() * Math.min(cols - 1, 7));
    const a = h * w;
    if (a < 12 || a > bigMax || h > rows || w > cols) continue;
    const r = Math.floor(R() * (rows - h + 1)), c = Math.floor(R() * (cols - w + 1));
    let free = true;
    for (let y = r; y < r + h && free; y++) for (let z = c; z < c + w; z++) if (g[y * cols + z]) { free = false; break; }
    if (!free) continue;
    for (let y = r; y < r + h; y++) for (let z = c; z < c + w; z++) g[y * cols + z] = 1;
    parts.push({ r, c, h, w });
    b++;
  }
  const max = 6, SMALL = [0, 0, 1, 1.3, 1.3, 0.7, 0.8];
  for (let i = 0; i < rows * cols; i++) {
    if (g[i]) continue;
    const r = Math.floor(i / cols), c = i % cols, opts = [];
    let maxW = 0;
    while (c + maxW < cols && !g[r * cols + c + maxW]) maxW++;
    for (let h = 1; r + h <= rows; h++) {
      let rowFree = 0;
      while (rowFree < maxW && !g[(r + h - 1) * cols + c + rowFree]) rowFree++;
      maxW = Math.min(maxW, rowFree);
      if (!maxW) break;
      for (let w = 1; w <= maxW; w++) {
        const a = h * w;
        if (a > max) break;
        if (a < 2) continue;
        let wt = SMALL[a];
        if (Math.min(h, w) === 1 && a >= 3) wt *= 1.3;
        opts.push({ h, w, wt });
      }
    }
    if (!opts.length) return null;
    let x = R() * opts.reduce((s, o) => s + o.wt, 0), pick = opts[opts.length - 1];
    for (const o of opts) { x -= o.wt; if (x <= 0) { pick = o; break; } }
    for (let y = r; y < r + pick.h; y++) for (let z = c; z < c + pick.w; z++) g[y * cols + z] = 1;
    parts.push({ r, c, h: pick.h, w: pick.w });
  }
  return parts;
}

// Clue square inside a part, biased to corners and edges so its position gives less away.
function clueSpot(p, R) {
  const spots = [];
  for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) {
    const edgeY = y === 0 || y === p.h - 1, edgeX = x === 0 || x === p.w - 1;
    spots.push({ y, x, wt: edgeY && edgeX ? 5 : edgeY || edgeX ? 2.2 : 1 });
  }
  let t = R() * spots.reduce((s, o) => s + o.wt, 0), pick = spots[spots.length - 1];
  for (const o of spots) { t -= o.wt; if (t <= 0) { pick = o; break; } }
  return { r: p.r + pick.y, c: p.c + pick.x, v: p.h * p.w };
}

// Counts solutions up to `limit` (exact cover over each clue's candidate rectangles).
// A clue with v = 0 is a "?" clue: any rectangle of 2+ squares holding only that clue.
// A search longer than `cap` steps reports `limit`, so a puzzle is only ever accepted when proven unique.
function countSolutions(rows, cols, clues, limit, cap = 30000) {
  const N = rows * cols, clueId = new Int16Array(N).fill(-1);
  clues.forEach((q, i) => clueId[q.r * cols + q.c] = i);
  const cover = Array.from({ length: N }, () => []);
  const add = (i, r0, c0, h, w) => {
    const cells = [];
    for (let r = r0; r < r0 + h; r++) for (let c = c0; c < c0 + w; c++) {
      const id = r * cols + c;
      if (clueId[id] >= 0 && clueId[id] !== i) return;
      cells.push(id);
    }
    const o = { i, cells };
    cells.forEach(id => cover[id].push(o));
  };
  clues.forEach((q, i) => {
    if (q.v > 0) {
      for (let h = 1; h <= q.v; h++) {
        if (q.v % h) continue;
        const w = q.v / h;
        if (h > rows || w > cols) continue;
        for (let r0 = Math.max(0, q.r - h + 1); r0 <= q.r && r0 + h <= rows; r0++)
          for (let c0 = Math.max(0, q.c - w + 1); c0 <= q.c && c0 + w <= cols; c0++) add(i, r0, c0, h, w);
      }
      return;
    }
    // "?": every clue-free rectangle around the clue, found band by band.
    for (let r0 = q.r; r0 >= 0; r0--) {
      if (r0 < q.r && clueId[r0 * cols + q.c] >= 0) break;
      for (let r1 = q.r; r1 < rows; r1++) {
        if (r1 > q.r && clueId[r1 * cols + q.c] >= 0) break;
        const free = c => { for (let r = r0; r <= r1; r++) { const id = r * cols + c; if (clueId[id] >= 0 && clueId[id] !== i) return false; } return true; };
        let L = q.c, Rt = q.c;
        while (L > 0 && free(L - 1)) L--;
        while (Rt < cols - 1 && free(Rt + 1)) Rt++;
        const h = r1 - r0 + 1;
        for (let c0 = L; c0 <= q.c; c0++) for (let c1 = q.c; c1 <= Rt; c1++) {
          const w = c1 - c0 + 1;
          if (h * w >= 2) add(i, r0, c0, h, w);
        }
      }
    }
  });
  const occ = new Uint8Array(N), used = new Uint8Array(clues.length);
  let count = 0, nodes = 0;
  const fits = o => { if (used[o.i]) return false; for (const id of o.cells) if (occ[id]) return false; return true; };
  (function rec(filled) {
    if (filled === N) { count++; return; }
    if (++nodes > cap) { count = limit; return; }
    let best = null;
    for (let id = 0; id < N; id++) {
      if (occ[id]) continue;
      const opts = cover[id].filter(fits);
      if (!opts.length) return;
      if (!best || opts.length < best.length) { best = opts; if (opts.length === 1) break; }
    }
    for (const o of best) {
      used[o.i] = 1; for (const id of o.cells) occ[id] = 1;
      rec(filled + o.cells.length);
      for (const id of o.cells) occ[id] = 0; used[o.i] = 0;
      if (count >= limit) return;
    }
  })(0);
  countSolutions.nodes = nodes;
  return count;
}

// Same key always gives the same puzzle with exactly one solution. Turns up to `qs` clues into "?"
// while the solution stays unique, then keeps the hardest of `pick` candidates (most solver steps).
function generate(key, { rows, cols, bigs, bigMax, pick, qs }) {
  const R = rng(hash(key));
  let best = null, last = null;
  for (let a = 0, found = 0; a < 800 && found < pick; a++) {
    const parts = partition(rows, cols, bigs, bigMax, R);
    if (!parts) continue;
    for (let k = 0; k < 4; k++) {
      const clues = parts.map(p => clueSpot(p, R));
      last = { rows, cols, clues, parts };
      if (countSolutions(rows, cols, clues, 2) !== 1) continue;
      let left = qs, tries = qs + 8;

  }

}

<script>

/* ---------- Game ---------- */
